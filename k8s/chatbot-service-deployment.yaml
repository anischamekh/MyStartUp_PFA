apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatbot-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chatbot-service
  template:
    metadata:
      labels:
        app: chatbot-service
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres 5432; do sleep 3; done"]
      containers:
        - name: chatbot-service
          image: anischamekh/mystartup-chatbot-service:latest
          ports:
            - containerPort: 8084
          envFrom:
            - configMapRef:
                name: mystartup-config
            - secretRef:
                name: mystartup-secrets
          env:
            - name: DB_URL
              value: jdbc:postgresql://postgres:5432/chatbot_db
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/chatbot_db
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8084
            initialDelaySeconds: 60
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8084
            initialDelaySeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: chatbot-service
spec:
  selector:
    app: chatbot-service
  ports:
    - port: 8084
      targetPort: 8084
