apiVersion: apps/v1
kind: Deployment
metadata:
  name: project-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: project-service
  template:
    metadata:
      labels:
        app: project-service
    spec:
      containers:
        - name: project-service
          image: anischamekh/mystartup-project-service:latest
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef:
                name: mystartup-config
            - secretRef:
                name: mystartup-secrets
          env:
            - name: DB_URL
              value: jdbc:postgresql://postgres:5432/project_db
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            initialDelaySeconds: 60
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8083
            initialDelaySeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: project-service
spec:
  selector:
    app: project-service
  ports:
    - port: 8083
      targetPort: 8083
