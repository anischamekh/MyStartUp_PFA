apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: anischamekh/mystartup-auth-service:latest
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: mystartup-config
            - secretRef:
                name: mystartup-secrets
          env:
            - name: DB_URL
              value: jdbc:postgresql://postgres:5432/auth_db
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  selector:
    app: auth-service
  ports:
    - port: 8081
      targetPort: 8081
