# Apply: kubectl apply -f k8s/secrets.yaml
# JWT_SECRET must be >= 32 bytes (256 bits) for HS256 — "replace-me" causes WeakKeyException.
# stringData values are stored as plain text in etcd (base64-encoded at rest by Kubernetes).
apiVersion: v1
kind: Secret
metadata:
  name: mystartup-secrets
type: Opaque
stringData:
  # 88-character secret (>> 256 bits). Rotate in production; keep in sync across all pods.
  JWT_SECRET: "9f3niTAR1XzzLrHfP/zTRT4dkU+Xp4ReMhdi1+xPYl8RK41jGRxhrc03uN3HC3tkzZPi5Wp9LtNQgxZaWr4+vA=="
  DB_USER: "postgres"
  DB_PASSWORD: "admin"
  APP_INTERNAL_API_KEY: "change-me-internal-api-key-k8s"
