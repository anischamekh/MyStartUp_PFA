services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # Kafka is a binary broker, not HTTP. Use this UI instead of opening http://localhost:9092 in a browser.
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181

  auth-service:
    build:
      context: ./microservices
      dockerfile: Dockerfile.runtime
      args:
        SERVICE: auth-service
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep UP || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: admin
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_SQL_INIT_MODE: never
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-real-projects-change-this-secret}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      APP_CORS_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "8081:8081"

  hrm-service:
    build:
      context: ./microservices
      dockerfile: Dockerfile.runtime
      args:
        SERVICE: hrm-service
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hrm_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: admin
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_SQL_INIT_MODE: never
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-real-projects-change-this-secret}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      AUTH_SERVICE_URL: http://auth-service:8081
      APP_CORS_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
    ports:
      - "8082:8082"
    volumes:
      - hrm-uploads:/app/uploads

  project-service:
    build:
      context: ./microservices
      dockerfile: Dockerfile.runtime
      args:
        SERVICE: project-service
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/project_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: admin
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_SQL_INIT_MODE: never
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-real-projects-change-this-secret}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      AUTH_SERVICE_URL: http://auth-service:8081
      APP_CORS_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
    ports:
      - "8083:8083"

  # Optional: use "docker compose --profile docker-ollama up" if you prefer Ollama in Docker
  # instead of the Windows app (models under %USERPROFILE%\.ollama\models).
  ollama:
    profiles: ["docker-ollama"]
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  chatbot-service:
    build:
      context: ./microservices
      dockerfile: Dockerfile.runtime
      args:
        SERVICE: chatbot-service
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/chatbot_db
      DB_USER: postgres
      DB_PASSWORD: admin
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-real-projects-change-this-secret}
      # Host Ollama on Windows (Docker Desktop): host.docker.internal
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:1b}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      AUTH_SERVICE_URL: http://auth-service:8081
      HRM_SERVICE_URL: http://hrm-service:8082
      PROJECT_SERVICE_URL: http://project-service:8083
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - auth-service
      - hrm-service
      - project-service
    ports:
      - "8084:8084"

  api-gateway:
    build:
      context: ./microservices
      dockerfile: Dockerfile.runtime
      args:
        SERVICE: api-gateway
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep UP || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    environment:
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-real-projects-change-this-secret}
      AUTH_SERVICE_URL: http://auth-service:8081
      HRM_SERVICE_URL: http://hrm-service:8082
      PROJECT_SERVICE_URL: http://project-service:8083
      CHATBOT_SERVICE_URL: http://chatbot-service:8084
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - redis
      - auth-service
      - hrm-service
      - project-service
      - chatbot-service
    ports:
      - "8080:8080"

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - api-gateway
      - auth-service
      - hrm-service
      - project-service
      - chatbot-service
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus

  # Web UI: http://localhost:8085 — port 50000 is for Jenkins agents (JNLP), not the dashboard.
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: mystartup-jenkins
    restart: unless-stopped
    ports:
      - "8085:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=true"

volumes:
  postgres_data:
  hrm-uploads:
  ollama_data:
  jenkins_home:
