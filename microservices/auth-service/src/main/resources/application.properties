spring.application.name=backend

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# Local document storage (relative to working directory)
app.files.upload-dir=uploads

# Datasource & JPA: configured in application.yml only (Docker uses SPRING_DATASOURCE_* env vars)

# JWT (use JWT_SECRET from Docker Compose / .env)
app.jwt.secret=${JWT_SECRET:change-this-secret-in-real-projects-change-this-secret}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Swagger/OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Mail (Gmail SMTP example)
# IMPORTANT: For Gmail you typically need an App Password (not your normal password).
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=mystartup.iteam@gmail.com
spring.mail.password=pehk hipe oppg pfrz
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
