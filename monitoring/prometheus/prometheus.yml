global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api-gateway:8080"]

  - job_name: auth-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["auth-service:8081"]

  - job_name: hrm-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["hrm-service:8082"]

  - job_name: project-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["project-service:8083"]

  - job_name: chatbot-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["chatbot-service:8084"]
